name: Patch language review rules in initialization prompt

on:
  push:
    paths:
      - ".language-review-init-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch initialization prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('prompts/INITIALIZE_EXISTING_REPOSITORY.md')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'anchor not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '│   ├── TERMINOLOGY.yaml\n│   ├── DECISIONS.md',
              '│   ├── TERMINOLOGY.yaml\n│   ├── PROSE_STYLE.yaml\n│   ├── DECISIONS.md',
              'PROSE_STYLE tree'
          )

          replace_once(
              '│       ├── consistency-auditor/\n│       │   └── SKILL.md\n│       └── publication-filter/',
              '│       ├── consistency-auditor/\n│       │   └── SKILL.md\n│       ├── academic-language-reviewer/\n│       │   └── SKILL.md\n│       └── publication-filter/',
              'language reviewer skill tree'
          )

          replace_once(
              '- `internal/EVIDENCE_INDEX.yaml`: map verified/provisional results, figures, tables, theorem/proof sources, data-generation scripts, and bibliography sources.\n',
              '- `internal/EVIDENCE_INDEX.yaml`: map verified/provisional results, figures, tables, theorem/proof sources, data-generation scripts, and bibliography sources.\n- `internal/PROSE_STYLE.yaml`: define concise factual-academic prose rules, evidence-proximal expression, paragraph/cadence rules, hedging policy, and common language anti-patterns. Keep it compact and use `TERMINOLOGY.yaml` as the canonical technical vocabulary source.\n',
              'PROSE_STYLE memory requirement'
          )

          replace_once(
              '- `internal/TERMINOLOGY.yaml`\n- target section;',
              '- `internal/TERMINOLOGY.yaml`\n- `internal/PROSE_STYLE.yaml`\n- target section;',
              'AGENTS source list'
          )

          replace_once(
              'Use for consistency, semantic duplication, defensive writing, over-expression, information ownership, notation, evidence, publication boundary, or reviewer-readiness checks.\n\n- read-only by default;',
              'Use for consistency, semantic duplication, defensive writing, over-expression, information ownership, notation, evidence, publication boundary, language quality, or reviewer-readiness checks.\n\nSelect an audit profile when possible: `FULL`, `LANGUAGE`, `CONSISTENCY`, or `EVIDENCE`. Requests to make prose more professional, precise, consistent, factual, or natural without changing logic should use `AUDIT PROFILE: LANGUAGE`.\n\n- read-only by default;',
              'AUDIT profile rules'
          )

          publication_anchor = '### 8.6 `publication-filter`\n'
          if publication_anchor not in s:
              raise SystemExit('anchor not found: publication filter section')
          language_skill = '''### 8.6 `academic-language-reviewer`\n\nTrigger:\n\n- `AUDIT PROFILE: LANGUAGE`;\n- terminology precision or wording-consistency review;\n- professional/factual academic expression review without changing argument logic;\n- defensive/meta prose, vague academicism, collocation, cadence, hedging, or formulaic AI-language review.\n\nRequired behavior:\n\n- read-only; never edit `paper/`;\n- read `TERMINOLOGY.yaml`, `PROSE_STYLE.yaml`, claim/section contracts, target text, adjacent text, and parallel descriptions elsewhere;\n- apply a strict LOGIC LOCK: do not change section/paragraph order, rhetorical role, central claim, claim strength, causal direction, evidence interpretation, numbers, equations, citations, assumptions, limitations, scope, methodological meaning, or argument dependencies;\n- check `TERM_AMBIGUITY`, `TERM_DRIFT`, `SEMANTIC_DRIFT`, `VAGUE_ACADEMICISM`, `DEFENSIVE_PROSE`, `META_PROSE`, `AI_FORMULAIC_PROSE`, `COLLOCATION`, `CADENCE`, `OVER_NOMINALIZATION`, hedging, and redundant signaling;\n- prefer concrete evidence-proximal subject + action + object wording over generic academic-sounding evaluation;\n- return a Language Change Ledger (`L001`, `L002`, ...) instead of a fully rewritten section;\n- each ledger item includes location, category, current wording, suggested wording, reason, canonical term/style rule, logic impact (`NONE` or `LOGIC_REVIEW_REQUIRED`), and confidence;\n- approved ledger IDs are implemented later with `EXACT_EDIT` only.\n\n'''
          s = s.replace(publication_anchor, language_skill + '### 8.7 `publication-filter`\n', 1)

          replace_once(
              'MODE: AUDIT\n\nSCOPE:',
              'MODE: AUDIT\nAUDIT PROFILE: FULL | LANGUAGE | CONSISTENCY | EVIDENCE\n\nSCOPE:',
              'audit template profile'
          )

          replace_once(
              '- how to update verified results.\n',
              '- how to update verified results;\n- how to run `AUDIT PROFILE: LANGUAGE`, review the Language Change Ledger, approve selected IDs, and implement them with `EXACT_EDIT`;\n- how `TERMINOLOGY.yaml` and `PROSE_STYLE.yaml` constrain language review.\n',
              'language workflow documentation'
          )

          s = s.replace('all six skills exist under `.agents/skills/`;', 'all seven skills exist under `.agents/skills/`;')

          markers = [
              'PROSE_STYLE.yaml',
              'academic-language-reviewer',
              'AUDIT PROFILE: FULL | LANGUAGE | CONSISTENCY | EVIDENCE',
              'Language Change Ledger',
              'LOGIC_REVIEW_REQUIRED',
              'all seven skills exist',
          ]
          for marker in markers:
              if marker not in s:
                  raise SystemExit(f'missing required marker after patch: {marker}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Clean temporary files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .language-review-init-trigger
          rm -f .github/workflows/patch-language-review-init.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add language review layer to initialization prompt"
          git push
