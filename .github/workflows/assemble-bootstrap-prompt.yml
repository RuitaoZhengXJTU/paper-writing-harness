name: Assemble bootstrap prompt

on:
  push:
    paths:
      - "prompts/.bootstrap-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and verify prompt
        shell: bash
        run: |
          set -euo pipefail
          cat prompts/.bootstrap-gz/*.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gzip --decompress \
            > prompts/INITIALIZE_EXISTING_REPOSITORY.md
          echo "3864c72b0437d9c2ef39370f2dbeffaa416fd3432c1a59f24fd6bc44cf8397b5  prompts/INITIALIZE_EXISTING_REPOSITORY.md" \
            | sha256sum --check --strict
          test "$(wc -c < prompts/INITIALIZE_EXISTING_REPOSITORY.md)" -eq 35550

      - name: Commit assembled prompt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prompts/.bootstrap-gz prompts/.bootstrap-parts prompts/.bootstrap-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prompts
          if ! git diff --cached --quiet; then
            git commit -m "Assemble repository bootstrap prompt"
            git push
          fi
