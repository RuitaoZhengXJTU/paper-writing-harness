name: Patch preview storage rules in initialization prompt

on:
  push:
    paths:
      - ".preview-storage-init-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch initialization prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('prompts/INITIALIZE_EXISTING_REPOSITORY.md')
          s = p.read_text(encoding='utf-8')

          old = '- create a versioned bundle under `scratch/previews/<preview-id>/`;'
          new = '''- every NEW preview must receive a NEW unique directory under `scratch/previews/`;\n- prefer preview IDs `YYYYMMDD-HHMM-<section-slug>-<short-id>` and verify the directory does not already exist before creating it;\n- never place preview Markdown, TeX, PDF, annotation, or TeX auxiliary files directly in `scratch/previews/`;\n- never reuse or overwrite another preview directory, even for the same manuscript section;\n- a materially new design alternative creates a new preview directory, while annotation-driven revisions of the same design stay in the existing directory and increment the revision;\n- maintain `scratch/previews/INDEX.md` with preview ID, target, creation time, latest revision, status, and relative path;\n- create the isolated bundle under `scratch/previews/<preview-id>/`;'''
          if old not in s:
              raise SystemExit('DESIGN_PREVIEW storage anchor not found')
          s = s.replace(old, new, 1)

          anchor = '### 7.8 Preview discipline\n\nEach preview is a versioned bundle:'
          replacement = '''### 7.8 Preview discipline\n\n`scratch/previews/` is an index-and-directory container, not a shared compilation workspace. Its root may contain only documentation/index files and child preview directories. Every newly created preview must use a fresh unique directory; never write loose `.md`, `.tex`, `.pdf`, annotation, or TeX auxiliary files at the preview root. Prefer `YYYYMMDD-HHMM-<section-slug>-<short-id>`, check for collisions before creation, and never reuse an existing preview ID. Maintain `scratch/previews/INDEX.md` to preserve historical discoverability. Materially new alternatives create new directories; annotation-driven revisions remain in the same directory.\n\nEach preview is a versioned bundle:'''
          if anchor not in s:
              raise SystemExit('Preview discipline anchor not found')
          s = s.replace(anchor, replacement, 1)

          skill_anchor = 'Required bundle under `scratch/previews/<preview-id>/`:'
          skill_replacement = '''For every NEW preview, first create a fresh unique `scratch/previews/<preview-id>/` directory and register it in `scratch/previews/INDEX.md`. Never reuse a previous preview directory or compile multiple previews in a shared working directory. Keep all TeX auxiliary outputs inside that preview's `render/` directory. A materially new alternative gets a new directory; PDF-annotation revisions of the same preview stay in the same directory and increment the revision.\n\nRequired bundle under `scratch/previews/<preview-id>/`:'''
          if skill_anchor not in s:
              raise SystemExit('section-architect anchor not found')
          s = s.replace(skill_anchor, skill_replacement, 1)

          # Ensure the future scratch README requirements mention the index.
          other = '- `scratch/README.md`: explain approval semantics.'
          other_new = '- `scratch/README.md`: explain approval semantics and the one-preview-per-directory storage invariant.\n- `scratch/previews/INDEX.md`: initialize a historical preview index and prohibit loose preview/build files at the preview root.'
          if other in s:
              s = s.replace(other, other_new, 1)

          required = [
              'every NEW preview must receive a NEW unique directory',
              'scratch/previews/INDEX.md',
              'not a shared compilation workspace',
              'never reuse a previous preview directory',
              "TeX auxiliary outputs inside that preview's `render/` directory",
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'missing marker after patch: {marker}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Clean temporary workflow and trigger, then commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .preview-storage-init-trigger
          rm -f .github/workflows/patch-preview-storage-init.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce isolated preview storage in initialization prompt"
          git push
